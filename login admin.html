<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mahasiswa - Admin Login</title>
    
    <link href="https://fonts.googleapis.com/css2 family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="login admin.css">
    <link rel="icon" href="logoITH.png">


</head>
<body>

    <div class="header-section">
        <div class="logo-placeholder">
            <img src="logoITH.png" alt="Logo">
        </div>
        <h1 class="title">Portal Admin</h1>
        <p class="subtitle">SVC — Student Voice Campus</p>
    </div>

    <div class="login-card">
        <form action="#" method="POST">
            <div class="input-group">
                <label>USER ADMIN</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-hashtag left-icon"></i>
                    <input type="text" placeholder="Masukkan  Username" required>
                </div>
            </div>

            <div class="input-group">
                <label>PASSWORD</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock left-icon"></i>
                    <input type="password" placeholder="Masukkan Password" id="password" required>
                    <button type="button" class="btn-toggle-password" onclick="togglePassword()">
                        <i class="fa-solid fa-eye-slash" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Login <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <a href="#" class="forgot-password">Lupa kata sandi?</a>
    </div>

    <script>
        // Fitur menyembunyikan/menampilkan kata sandi
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
